name: Verify Pull Request

on: pull_request

env:
  HUSKY: 0

permissions:
  pull-requests: write

jobs:
  verify_pull_request:
    name: Verify Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies 🧱
        run: npm ci

      - name: Lint 🤔
        run: npm run lint

      - name: Test 🧪
        run: |
          npx jest --coverage --coverageReporters text json-summary | tee ./coverage.txt && exit ${PIPESTATUS[0]}

      - name: Build 🏗
        run: npm run build

      - name: Jest Coverage Comment
        uses: MishaKav/jest-coverage-comment@main
        with:
          coverage-path: ./coverage.txt
          summary-title: Coverage summary
          report-only-changed-files: true
